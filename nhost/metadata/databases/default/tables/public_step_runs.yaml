table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflowRun
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflowStep
    using:
      foreign_key_constraint_on: workflow_step_id
array_relationships:
  - name: notifications
    using:
      foreign_key_constraint_on:
        column: step_run_id
        table:
          name: notifications
          schema: public
  - name: orgMembers
    using:
      manual_configuration:
        column_mapping:
          org_id: org_id
        insertion_order: null
        remote_table:
          name: org_members
          schema: public
  - name: outputs
    using:
      foreign_key_constraint_on:
        column: step_run_id
        table:
          name: workflow_outputs
          schema: public
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: editor
      allow_aggregations: true
  - role: owner
    permission:
      columns: '*'
      filter:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: viewer
      allow_aggregations: true
