table:
  name: organizations
  schema: public
object_relationships:
  - name: usageThisMonth
    using:
      manual_configuration:
        column_mapping:
          id: org_id
        insertion_order: null
        remote_table:
          name: org_usage_this_month
          schema: public
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: runStats
    using:
      manual_configuration:
        column_mapping:
          id: org_id
        insertion_order: null
        remote_table:
          name: org_run_stats
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: owner
    permission:
      columns: '*'
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: owner
    permission:
      columns:
        - name
      filter:
        members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      check:
        members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
