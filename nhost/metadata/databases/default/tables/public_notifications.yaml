table:
  name: notifications
  schema: public
object_relationships:
  - name: stepRun
    using:
      foreign_key_constraint_on: step_run_id
array_relationships:
  - name: orgMembers
    using:
      manual_configuration:
        column_mapping:
          org_id: org_id
        insertion_order: null
        remote_table:
          name: org_members
          schema: public
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: editor
      allow_aggregations: true
  - role: owner
    permission:
      columns: '*'
      filter:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: viewer
      allow_aggregations: true
event_triggers:
  - name: on_notification_insert
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: '{{NHOST_FUNCTIONS_URL}}/notify-dispatcher'
