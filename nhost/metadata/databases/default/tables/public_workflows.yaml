table:
  name: workflows
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: orgMembers
    using:
      manual_configuration:
        column_mapping:
          org_id: org_id
        insertion_order: null
        remote_table:
          name: org_members
          schema: public
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
insert_permissions:
  - role: editor
    permission:
      check:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: editor
      set:
        created_by: X-Hasura-User-Id
      columns:
        - org_id
        - name
        - description
        - is_active
  - role: owner
    permission:
      check:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      set:
        created_by: X-Hasura-User-Id
      columns:
        - org_id
        - name
        - description
        - is_active
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: editor
      allow_aggregations: true
  - role: owner
    permission:
      columns: '*'
      filter:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: viewer
      allow_aggregations: true
update_permissions:
  - role: editor
    permission:
      columns:
        - name
        - description
        - is_active
      filter:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: editor
      check:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: editor
  - role: owner
    permission:
      columns:
        - name
        - description
        - is_active
      filter:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      check:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
delete_permissions:
  - role: owner
    permission:
      filter:
        orgMembers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
