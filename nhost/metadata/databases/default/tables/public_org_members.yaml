table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: orgPeers
    using:
      manual_configuration:
        column_mapping:
          org_id: org_id
        insertion_order: null
        remote_table:
          name: org_members
          schema: public
insert_permissions:
  - role: owner
    permission:
      check:
        orgPeers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      columns:
        - org_id
        - user_id
        - role
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - orgPeers:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: editor
      allow_aggregations: true
  - role: owner
    permission:
      columns: '*'
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - orgPeers:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - orgPeers:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: viewer
      allow_aggregations: true
update_permissions:
  - role: owner
    permission:
      columns:
        - role
      filter:
        orgPeers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      check:
        orgPeers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
delete_permissions:
  - role: owner
    permission:
      filter:
        orgPeers:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
