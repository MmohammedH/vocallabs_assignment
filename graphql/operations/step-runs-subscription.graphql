# Live per-step progress for a single run, including the paused/
# awaiting-approval state (step type=approval_gate, status=paused).
# Filtered to workflow_run_id — Layer 1 permissions still apply on top of
# this filter, so subscribing with a foreign org's run id yields an empty,
# permanently-silent subscription rather than an error or a data leak.
subscription StepRunsForRun($workflowRunId: uuid!) {
  step_runs(where: { workflow_run_id: { _eq: $workflowRunId } }, order_by: { step_order: asc }) {
    id
    step_order
    type
    status
    input
    output
    error
    attempt_count
    approved_by
    approved_at
    started_at
    completed_at
    workflowStep {
      name
    }
  }
}
